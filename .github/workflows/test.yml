name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lua runtime for the addon tests
        run: pip install lupa
      - name: Pipeline and addon tests
        run: python -m unittest discover -s pipeline/tests -v
