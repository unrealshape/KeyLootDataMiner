name: Data refresh

# A run reads the Mythic+ players of four regions (gear, stats, talents), so it takes well over an hour on a
# cold cache; the players' stats and talents are cached between runs (actions/cache, never committed).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1,4"

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Restore the character caches
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/cache/stats.json
            pipeline/cache/talents.json
            pipeline/cache/profiles.json
          key: character-cache-${{ github.run_id }}
          restore-keys: character-cache-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lua runtime for the addon tests
        run: pip install lupa
      - name: Pipeline and addon tests
        run: python -m unittest discover -s pipeline/tests -v
      # Sources, each writing one JSON file into build/datasets/ (shape: pipeline/klm/model.py).
      # Credentials come from the repository secrets, never from the repo:
      #   BLIZZARD_CLIENT_ID, BLIZZARD_CLIENT_SECRET, WCL_CLIENT_ID, WCL_CLIENT_SECRET
      - name: Source - Blizzard (drop locations, best Mythic+ players' gear)
        run: python pipeline/fetch_blizzard.py --out build/datasets --pool 300 --profile-limit 50
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      # Saved even when the source fails, so a long run keeps what it already read.
      - name: Save the character caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            pipeline/cache/stats.json
            pipeline/cache/talents.json
            pipeline/cache/profiles.json
          key: character-cache-${{ github.run_id }}
      - name: Source - Warcraft Logs (best raiders' gear)
        run: python pipeline/fetch_wcl.py --out build/datasets
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
      - name: Source - item facts and the sources the journal lacks (Catalyst, crafted)
        run: python pipeline/fetch_items.py --datasets build/datasets
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      - name: Merge into the addon's Lua data
        run: python pipeline/build.py --datasets build/datasets --out addon/KeyLootMaster/Data --max-raid-items 3
      - name: Commit the data when it changed
        run: |
          git config user.name "unrealshape"
          git config user.email "18093073+unrealshape@users.noreply.github.com"
          git add addon/KeyLootMaster/Data pipeline/cache
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Data: daily update"
            git push
          fi
      # The addon as a download: KeyLootMaster.zip on the release "latest", replaced after every run.
      - name: Publish the addon as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd addon && zip -qr ../KeyLootMaster.zip KeyLootMaster)
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest KeyLootMaster.zip --clobber
          else
            gh release create latest KeyLootMaster.zip --title "KeyLootMaster (latest data)" \
              --notes "The addon with the newest data."
          fi
          gh release edit latest --notes "Data of $(date -u +%Y-%m-%d). Unzip into World of Warcraft/_retail_/Interface/AddOns."
